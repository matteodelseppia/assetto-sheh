<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/css/xterm.min.css">
    <style>
        body { margin: 0; background: #0d1117; overflow: hidden; }
        #terminal { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="/lib/xterm.min.js"></script>
    <script src="/lib/xterm-addon-fit.min.js"></script>
    <script>
        const terminal = new Terminal({
            cursorBlink: true,
            theme: { background: '#0d1117' },
            fontFamily: 'monospace',
            fontSize: 14,
            scrollback: 5000
        });

        const fitAddon = new FitAddon.FitAddon();
        terminal.loadAddon(fitAddon);
        terminal.open(document.getElementById('terminal'));
        fitAddon.fit();
        terminal.focus();

        const ws = new WebSocket(`ws://${window.location.host}`);

        const sendResize = () => {
            fitAddon.fit();
            if (ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'resize', cols: terminal.cols, rows: terminal.rows }));
            }
        };

        ws.onopen = sendResize;

        ws.onmessage = async function(event) {
            let data;
            if (event.data instanceof Blob) {
                data = await event.data.text()
            } else {
                data = event.data
            }

            terminal.write(data)
        };

        terminal.onData(data => { 
            if (ws.readyState === 1) ws.send(data)
        })

        window.onresize = sendResize;


    </script>
</body>
</html>
